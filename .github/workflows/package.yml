name: Build Bosun Packages

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows
          - os: ubuntu-latest
            name: linux

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system audio library (Linux)
        if: matrix.name == 'linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libportaudio2 xvfb

      - name: Install dependencies
        run: python -m pip install --upgrade pip pyinstaller ".[desktop]"

      - name: Build desktop app and command-line tool
        shell: bash
        run: |
          EXTRA=""
          if [ "${{ matrix.name }}" = "windows" ]; then
            EXTRA="--icon packaging/windows/bosun.ico"
          else
            PA=$(ldconfig -p | grep -m1 'libportaudio.so.2 ' | awk '{print $NF}')
            EXTRA="--add-binary $PA:."
          fi
          pyinstaller --clean --noconfirm --onefile --windowed --name Bosun $EXTRA \
            --collect-all bosun --collect-all pyrtlsdrlib --collect-all rtlsdr \
            --collect-all sounddevice --hidden-import PIL._tkinter_finder \
            packaging/gui_entry.py
          pyinstaller --noconfirm --onefile --name bosun-cli \
            --collect-all bosun packaging/entry.py

      - name: Smoke test (Linux)
        if: matrix.name == 'linux'
        run: |
          ./dist/bosun-cli --version
          xvfb-run -a ./dist/Bosun --selftest

      - name: Smoke test (Windows)
        if: matrix.name == 'windows'
        shell: pwsh
        run: |
          ./dist/bosun-cli.exe --version
          $p = Start-Process -FilePath dist/Bosun.exe -ArgumentList "--selftest" -PassThru -Wait
          if ($p.ExitCode -ne 0) { throw "Bosun.exe self-test failed: $($p.ExitCode)" }

      - name: Package Windows executable and installer
        if: matrix.name == 'windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force package | Out-Null
          Copy-Item dist/Bosun.exe, dist/bosun-cli.exe, packaging/windows/README.txt package/
          Compress-Archive -Path package/* -DestinationPath Bosun-Windows-x64.zip -Force
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue)) {
            $env:Path += ";${env:ProgramFiles(x86)}\Inno Setup 6"
          }
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue)) {
            choco install innosetup -y --no-progress
            $env:Path += ";${env:ProgramFiles(x86)}\Inno Setup 6"
          }
          $env:BOSUN_VERSION = (python -c "from bosun.version import __version__; print(__version__)")
          iscc packaging/windows/bosun.iss
          Copy-Item installer/Bosun-Windows-Desktop-Setup.exe .

      - name: Package Linux app
        if: matrix.name == 'linux'
        run: |
          mkdir -p package
          cp dist/Bosun dist/bosun-cli bosun/assets/bosun.png package/
          cp packaging/linux/bosun.desktop packaging/linux/install.sh packaging/linux/uninstall.sh package/
          chmod +x package/Bosun package/bosun-cli package/*.sh
          tar -czf Bosun-Linux-x86_64.tar.gz -C package .
          (cd package && zip -q -r ../Bosun-Linux-x86_64.zip .)

      - name: Upload build files
        uses: actions/upload-artifact@v4
        with:
          name: Bosun-${{ matrix.name }}
          path: |
            Bosun-Windows-x64.zip
            Bosun-Windows-Desktop-Setup.exe
            Bosun-Linux-x86_64.tar.gz
            Bosun-Linux-x86_64.zip
          if-no-files-found: error

  android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Briefcase
        run: python -m pip install --upgrade pip briefcase

      - name: Build APK
        # Briefcase installs its own Android SDK; ignore the runner's preinstalled one.
        # "yes" accepts the Android SDK licences, which --no-input would decline.
        run: |
          yes | env -u ANDROID_HOME -u ANDROID_SDK_ROOT briefcase create android
          yes | env -u ANDROID_HOME -u ANDROID_SDK_ROOT briefcase build android
          mkdir -p apk
          find build -name "*.apk" -path "*outputs*" -exec cp {} apk/Bosun-Mobile-Android.apk \;
          ls -l apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Bosun-android
          path: apk/Bosun-Mobile-Android.apk
          if-no-files-found: error
